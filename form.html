<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <label for="name">Name</label>
                    <input type="text" name="" id="name"><br>
                    <label for="phone">Phone Number</label>
                    <input type="number" name="" id="phone"> <br>
                    <label for="email">Email</label>
                    <input type="email" name="" id="email">
                </fieldset>

                <fieldset>
                    <legend>Pitha Info</legend>

                    <input type="radio" name="chitoi" id="chitoi">
                    <label for="chitoi">Chitoi</label>

                    <input type="radio" name="vapa" id="vapa">
                    <label for="vapa">Vapa</label>

                    <input type="radio" name="" id="Puri">
                    <label for="Puri">Dal Puri</label>


                </fieldset>
                <fieldset>
                    <legend>Vorta Info</legend>

                    <input type="checkbox" name="chitoi" id="sorisa">
                    <label for="sorisa">Sorisa</label>

                    <input type="checkbox" name="vapa" id="sutki">
                    <label for="sutki">Sutki</label>

                    <input type="checkbox" name="" id="morish">
                    <label for="morish">Morich</label>


                </fieldset>
                <fieldset>
                    <legend>Extra Info</legend>
                    <textarea name="" id="" cols="90" rows="10"></textarea>
                </fieldset>
                <input type="button" value="Submit">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>
</body>

</html>
